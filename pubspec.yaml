name: apartalo_app
description: App de gestión de inventario y pedidos con escáner

publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0

  # Speech & Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Camera & Images (versiones estables)
  image_picker: ^1.0.7
  mobile_scanner: ^6.0.2
  cached_network_image: ^3.3.1

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # Utils
  permission_handler: ^11.3.0
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.4
  qr_flutter: ^4.1.0

  # Bluetooth Printer
  flutter_blue_plus: ^1.31.15
  
  # State Management
  provider: ^6.1.1

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.1

  # Firebase
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  cloud_firestore: ^5.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_native_splash: ^2.3.8

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/splash/

# Configuración de Splash Screen Nativo
flutter_native_splash:
  color: "#231e14"
  image: assets/splash/splash.png
  color_dark: "#231e14"
  image_dark: assets/splash/splash.png
  android_12:
    color: "#231e14"
    icon_background_color: "#231e14"
    image: assets/splash/splash.png
    color_dark: "#231e14"
    icon_background_color_dark: "#231e14"
    image_dark: assets/splash/splash.png
  ios: true
  android: true
  web: false
